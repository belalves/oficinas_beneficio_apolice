name: Publicar no GitHub Pages

# Publica o dashboard (site estático) sempre que houver push na branch,
# e permite rodar manualmente pelo botão "Run workflow" na aba Actions.
on:
  push:
    branches: ["claude/workshop-coverage-dashboard-klox0x"]
  workflow_dispatch:

# Permissões necessárias para o deploy no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
